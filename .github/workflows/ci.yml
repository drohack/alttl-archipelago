name: CI

# Archipelago updates its own dependencies at import time: ModuleUpdate.update()
# runs at the top of Generate.py and MultiServer.py, walks every world's
# requirements file, and when one is unsatisfied it does not fail - it PROMPTS.
# On a runner with no stdin that prompt is an EOFError and a red build, and the
# requirement in question belonged to a world we do not ship (factorio-rcon-py).
#
# CI installs what it needs itself, so the self-update has nothing to do.
# Skipping it also stops the unrelated worlds that import MultiServer from
# failing to load, which is what buried the real error in a screen of noise.
env:
  SKIP_REQUIREMENTS_UPDATE: "1"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # The point of this job is the ABSENCE of a game install. Core is pure C#
    # with no Unity, BepInEx or Archipelago references, and building it alone
    # on a runner that has none of those is what enforces that. If someone adds
    # a game reference to Core, this job is what fails.
    #
    # The BepInEx plugin deliberately is NOT built here: it references interop
    # assemblies derived from the game, which a public runner cannot have and
    # which must never be committed.
    name: Core (no game installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core standalone
        run: dotnet build src/ALTTLArchipelago.Core -c Release
      - name: Core unit tests
        run: dotnet test src/ALTTLArchipelago.Core.Tests -c Release --nologo

  version:
    # One number lives in three files: the csproj, [BepInPlugin], and the
    # world manifest. They drifted to 0.1.0 / 0.1.0 / 0.3.0 in a single
    # session, which would have shipped a mod and an apworld that agreed on a
    # version and disagreed about the item table.
    name: Version is consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check the version and the manifest
        run: python tools/check-version.py

  ascii:
    # Non-ASCII characters break quietly on Windows: Python encodes redirected
    # stdout as cp1252, so a single em dash in a progress line kills a script.
    # Cheaper to forbid them than to debug them.
    name: ASCII only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check for non-ASCII
        run: |
          python3 - <<'PY'
          import glob, sys
          # *.yaml as well as *.yml: the shipped player template is a .yaml,
          # and it was not being checked at all until it existed.
          patterns = ["**/*.md", "**/*.cs", "**/*.py", "**/*.csproj",
                      "**/*.yml", "**/*.yaml", "**/*.json"]
          # All gitignored, so a CI checkout has none of them - listed anyway
          # so a developer running this snippet locally sees what CI sees.
          # testserver/ in particular holds upstream's preset yamls, which are
          # full of BOMs and em dashes and are not ours to rewrite.
          skip = ("/bin/", "/obj/", "/Archipelago/", "/docs/data/",
                  "/testserver/", "/dist/")
          bad = 0
          for pat in patterns:
              for f in glob.glob(pat, recursive=True):
                  if any(s in "/" + f.replace("\\", "/") for s in skip):
                      continue
                  with open(f, encoding="utf-8", errors="replace") as fh:
                      for n, line in enumerate(fh, 1):
                          for ch in line:
                              if ord(ch) > 126 and ch != "\n":
                                  print(f"{f}:{n}: U+{ord(ch):04X} {ch!r}")
                                  bad += 1
          if bad:
              print(f"\n{bad} non-ASCII character(s). See the Characters rule in CLAUDE.md.")
              sys.exit(1)
          print("clean")
          PY

  versions:
    # Which Archipelago versions the world is tested against, resolved rather
    # than written down, so the list cannot go stale by nobody editing it.
    #
    # TWO, and they are usually the same one:
    #
    #   minimum  archipelago.json's minimum_ap_version. The version we CLAIM
    #            to support. Testing only main and shipping a claim about the
    #            minimum is how cw4 left breakage for its players to find.
    #   latest   the newest GitHub RELEASE. What a player actually installs.
    #
    # On 2026-09-06 both are 0.6.7 - 0.6.8 exists only on main and has never
    # been released - so this runs one leg and says so. The point is that the
    # day 0.6.8 ships, the second leg appears on its own and a break against
    # it is ours to find rather than a player's.
    #
    # Deliberately NOT main. An unreleased branch can be red for reasons that
    # never reach anybody, and chasing it is work nobody asked for.
    name: Resolve Archipelago versions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          min=$(python3 -c "import json;print(json.load(open('apworld/alttl/archipelago.json'))['minimum_ap_version'])")
          latest=$(gh api repos/ArchipelagoMW/Archipelago/releases/latest --jq .tag_name)
          echo "declared minimum: $min"
          echo "latest release:   $latest"
          if [ "$min" = "$latest" ]; then
            echo "the minimum IS the latest release; one leg"
            entries="[{\"ref\":\"$min\",\"label\":\"minimum, and currently also the latest release\"}]"
          else
            echo "two legs: the minimum we claim, and the latest a player installs"
            entries="[{\"ref\":\"$min\",\"label\":\"declared minimum\"},{\"ref\":\"$latest\",\"label\":\"latest release\"}]"
          fi
          echo "matrix=$entries" >> "$GITHUB_OUTPUT"

  apworld:
    # Run against every version `versions` resolved - see that job. Not pinned
    # to main. If we test
    needs: versions
    strategy:
      # A break on one version must not cancel the other leg. Knowing it fails
      # on BOTH, or on only one, is most of the diagnosis.
      fail-fast: false
      matrix:
        ap: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: apworld (AP ${{ matrix.ap.ref }} - ${{ matrix.ap.label }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check out Archipelago
        uses: actions/checkout@v5
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ matrix.ap.ref }}
          path: ap
      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ap/requirements.txt
      - name: Install the world
        run: cp -r apworld/alttl ap/worlds/alttl
      - name: Unit tests
        working-directory: ap
        run: python -m unittest discover -s worlds/alttl/test -t .
      - name: Fill stress sweep
        working-directory: ap
        # Wider than the local default. A fill failure is probabilistic, and a
        # green suite on five seeds is exactly how the 2026-09-02 breakage
        # stayed hidden.
        env:
          ALTTL_STRESS_SEEDS: '50'
        run: python -m unittest worlds.alttl.test.test_fill_stress
      - name: Generate a real seed
        working-directory: ap
        # The one path the unit tests do not cover: yaml parsing, output
        # writing and the playthrough calculation.
        run: |
          mkdir -p players out
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('players', False)"
          find players -maxdepth 1 -name '*.yaml' ! -name 'A Little to the Left.yaml' -delete
          python Generate.py --player_files_path players --outputpath out --seed 20260902
          test -n "$(ls out/*.zip)"

  compliance:
    # Archipelago ships a generic suite that EVERY world must pass. This project
    # never ran it, and when it finally was, it failed: archipelago.json
    # declared 'version' and 'compatible_version', which describe the .apworld
    # container and are forbidden in a world manifest. That sat in the tree
    # through every commit until the suite that exists to catch it was finally
    # run.
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        ap: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: compliance (AP ${{ matrix.ap.ref }} - ${{ matrix.ap.label }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check out Archipelago
        uses: actions/checkout@v5
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ matrix.ap.ref }}
          path: ap
      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ap/requirements.txt
      - name: Install the world
        run: cp -r apworld/alttl ap/worlds/alttl
      - name: Keep only the worlds the suite needs
        # The suite runs every test against every INSTALLED world, so a full
        # checkout means testing a hundred other games to check ours - about
        # four minutes, nearly all of it other people's.
        #
        # 0.6.8 added AP_TEST_WORLDS for exactly this, scoping world loading to
        # a named list plus the suite's own fixtures - but this job now runs as
        # a MATRIX over several Archipelago versions, and 0.6.7 has no such
        # switch. Deleting worlds is the one mechanism that works on every leg,
        # and one mechanism is worth more here than a marginally faster run on
        # some of them.
        #
        # Safe here and ONLY here: a throwaway checkout in its own job, which
        # is why the suite was moved out of the apworld job rather than pruned
        # in place.
        #
        # generic and apquest are the fixture worlds 0.6.8 names in
        # _SUITE_FIXTURE_WORLDS - the suite needs them and does not test them.
        # Keeping them on 0.6.7 too is harmless; it predates the concept.
        run: |
          cd ap/worlds
          for d in */; do
            name="${d%/}"
            case "$name" in
              alttl|generic|apquest|_*) continue ;;
            esac
            rm -rf "$name"
          done
          echo "worlds kept: $(ls -d */ | tr -d '/' | tr '\n' ' ')"
      - name: Archipelago's world compliance tests
        working-directory: ap
        # Do NOT swap this for `unittest -k "A Little to the Left"`. It looks
        # like the same thing and is not: only the manifest tests generate a
        # class per world, so -k matches three tests out of 322 and silently
        # skips test_fill, test_ids and test_reachability, which loop over
        # worlds inside the test body. Measured.
        run: python -m unittest discover -s test/general -t .

  apworld-package:
    # Tests the ARTIFACT, not the folder. A world runs from inside a zip once
    # packaged, where nothing has a path on disk, so a world that reads its own
    # data with open() works all through development and fails the instant a
    # player installs the release. That shipped here once. This job removes the
    # loose copy, installs only the .apworld, and generates a real seed - the
    # only arrangement in which that class of bug is visible.
    #
    # Deliberately NOT matrixed over Archipelago versions like apworld and
    # compliance are. What it tests is the SHAPE of the artifact - that
    # nothing inside reads its own files by path - which does not vary by
    # Archipelago version, and it uploads the release artifact, so a matrix
    # would produce several identical zips fighting over one artifact name.
    name: apworld package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read the minimum supported Archipelago version
        id: ap
        run: |
          python3 -c "import json;print('ref=' + json.load(open('apworld/alttl/archipelago.json'))['minimum_ap_version'])" >> "$GITHUB_OUTPUT"
      - name: Check out Archipelago at that version
        uses: actions/checkout@v5
        with:
          repository: ArchipelagoMW/Archipelago
          ref: ${{ steps.ap.outputs.ref }}
          path: ap
      - name: Install Archipelago's requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r ap/requirements.txt
      - name: Build the apworld
        run: python tools/build_apworld.py --out dist --install-to ap
      - name: Confirm no loose copy can satisfy the import
        run: |
          test ! -e ap/worlds/alttl
          test -f ap/custom_worlds/alttl.apworld
      - name: The packaged world must load
        working-directory: ap
        run: |
          python -c "
          from worlds.AutoWorld import AutoWorldRegister
          w = AutoWorldRegister.world_types['A Little to the Left']
          assert w.zip_path, 'loaded from a folder, not the .apworld'
          print('loaded from', w.zip_path)
          "
      - name: Generate a real seed from the packaged world
        working-directory: ap
        run: |
          mkdir -p players out
          python -c "from Options import generate_yaml_templates; generate_yaml_templates('players', False)"
          find players -maxdepth 1 -name '*.yaml' ! -name 'A Little to the Left.yaml' -delete
          python Generate.py --player_files_path players --outputpath out --seed 20260902
          test -n "$(ls out/*.zip)"
      - uses: actions/upload-artifact@v4
        with:
          name: alttl-apworld
          path: dist/alttl.apworld
          if-no-files-found: error

  release-refuses:
    # tools/package-release.py cannot run here - the plugin needs the game's
    # interop assemblies, which a public runner cannot have and which must
    # never be committed. What CAN be checked is the half that has nothing to
    # do with the game: that it REFUSES a version mismatch.
    #
    # Worth a job of its own because the refusal is the whole point. A
    # packager that warns and carries on is how a mod and an apworld ship
    # agreeing on a number and disagreeing about the item table.
    name: Packaging refuses a version mismatch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: It passes on the tree as committed
        run: python tools/check-version.py
      - name: It fails when the manifest drifts
        run: |
          python3 -c "
          import json, pathlib
          p = pathlib.Path('apworld/alttl/archipelago.json')
          d = json.loads(p.read_text())
          d['world_version'] = '99.99.99'
          p.write_text(json.dumps(d))
          "
          if python tools/check-version.py; then
            echo "check-version.py PASSED on a tree with a drifted version"
            exit 1
          fi
          echo "refused, as it must"
      - name: And packaging refuses too, without building anything
        run: |
          if python tools/package-release.py --skip-build; then
            echo "package-release.py PACKAGED a version mismatch"
            exit 1
          fi
          test ! -d dist
          echo "refused, and wrote nothing"
