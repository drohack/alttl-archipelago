# A Little to the Left - Archipelago player settings
#
# Edit `name`, save, and hand this to whoever generates the multiworld.
# Everything below is set to its default, so the file works untouched.
#
# The full description of every setting is on the Archipelago webhost player
# options page for this game, which is generated from the same source as this
# file. What is here is the short version.

# Your name in-game, limited to 16 characters.
#     {player} will be replaced with the player's slot number.
#     {number} will be replaced with the counter value of the name.
# Keep a placeholder in it if you generate more than one slot from this file:
# two slots that resolve to the same name will not generate.
name: Player{number}

game: A Little to the Left

# Describes this file rather than the game - useful once you have several.
description: Default A Little to the Left Template

requires:
  version: 0.6.7

A Little to the Left:

  # ---- Goal -----------------------------------------------------------

  # What unlocks the credits.
  #
  #   beat_levels  finish levels_to_beat puzzles, any one way each
  #   star_levels  STAR levels_to_star puzzles - every check on the puzzle,
  #                every solution and every part. The same star the level
  #                select draws on a card with nothing left to do.
  #
  # A Skip fills in every check on the puzzle it clears, so a skipped puzzle
  # counts as starred as well as beaten under either goal.
  goal: beat_levels

  # Puzzles to beat before the credits unlock, when goal is beat_levels. A
  # puzzle counts once solved any one way, or skipped. Clamped to
  # puzzle_count. 1 to 79.
  levels_to_beat: 40

  # Puzzles to star before the credits unlock, when goal is star_levels.
  # Ignored otherwise. Lower than levels_to_beat by default because starring
  # is a great deal more work than beating. Clamped to puzzle_count. 1 to 79.
  levels_to_star: 20

  # How many puzzles the run contains. The full game is 79, laid out over
  # five chapters exactly as vanilla. A lower number truncates the track
  # rather than rescaling it. 10 to 79: the smallest run is two full packs
  # of 5.
  #
  # 70 rather than 79 so the level select's overview strip fits the screen:
  # 70 puzzles + 13 pack dividers + the credits card is 84 cards, and the
  # game's own strip is sized for about 85. Higher still works - the strip
  # scales itself down - it just gets smaller.
  puzzle_count: 70

  # How many puzzles each Puzzle Pack unlocks. EVERY block is this size,
  # including the free opening; only the last is short, because a run rarely
  # divides evenly.
  #
  # 1 to 10, but read that as a FLOOR rather than a promise. Two things
  # raise it. Below 5 the run still opens 5, so it cannot start on a puzzle
  # an unlucky ability draw has locked. And a run can only carry 14 packs,
  # so when packs of your size would need more than that they all grow
  # together - at puzzle_count 79 you get packs of 6 whether you asked for
  # 1 or 5. At the default 70 you get exactly the 5 you asked for.
  pack_size: 5

  # ---- What goes in the run -------------------------------------------

  # How strongly to favour procedurally generated puzzles - the sixteen that
  # build a fresh layout from a seed, so they are new even if you have
  # finished the game.
  #
  # This and the two below are RELATIVE weights, not percentages. 80/10/10
  # and 8/1/1 mean the same thing; what matters is the ratio between them.
  # The name is about where a puzzle comes from, not about it being
  # randomly generated in the Archipelago sense. 0 to 100.
  generator_weight: 80

  # How strongly to favour the seasonal event puzzles. Most players have
  # never seen them, and they are the richest levels for checks. 0 to 100.
  archive_weight: 10

  # How strongly to favour the 69 main-campaign puzzles. This is the largest
  # pool of one-shot levels in the game, so it is what stops a long run
  # repeating the same generator. Set it to 0 and the campaign is invisible
  # except where mechanic_coverage drags a level in. 0 to 100.
  base_weight: 10

  # Puzzles RESERVED for each mechanic no generator can make - stacking,
  # containers, drawers and jigsaws. Four mechanics that only exist as
  # hand-made levels, so without this they turn up by luck or not at all.
  #
  # ABOVE ZERO, EVERY mechanic is guaranteed at least one puzzle, not only
  # those four. The other eight come from generators and show up by
  # themselves in a full run, but a short one can miss them: at
  # puzzle_count 20, Rotating was absent from half the seeds measured
  # before this. The number below is the count for the four scarce ones.
  #
  # HIGHER IS LESS RANDOM, not more: every point pins more of the run to a
  # fixed set of levels. Measured across seeds, at any run length:
  #
  #   0   the reserve is OFF entirely - no floor, no guarantee, every
  #       mechanic left to the weighted draw. This is the simpler run.
  #   3   3 jigsaws, 3 or 4 drawer puzzles, one of everything else
  #   4   all 4 jigsaws the game has, every seed
  #   5   all 4 jigsaws AND all 5 drawer puzzles, every seed
  #   6   identical to 5 - there is nothing left to reserve
  #
  # So 6 is the LEAST random setting, not the most, and it buys nothing
  # over 5.
  #
  # A floor, not the only door - campaign puzzles also arrive through
  # base_weight above. 0 to 6.
  mechanic_coverage: 3

  # Most times any one generated puzzle may appear. 0 uses the maximum.
  # Each appearance is a genuinely different layout, but the card art
  # repeats.
  generator_repeat_limit: 0

  # Which seasonal event packs may appear. These six are every valid key,
  # and the list below is the default - delete a line to drop that pack.
  #
  #   good_tidings       Good Tidings       6 puzzles
  #   trick_or_tidy      Trick or Tidy      5 puzzles
  #   merry_mess         Merry Mess         5 puzzles
  #   drawer_chores      Drawer Chores      3 puzzles
  #   something_eggstra  Something Eggstra  4 puzzles
  #   snack_pack         Snack Pack         3 puzzles
  #
  # Removing a pack removes its puzzles. Jigsaws exist ONLY in the first
  # four, so dropping all of good_tidings, trick_or_tidy, merry_mess and
  # drawer_chores takes the jigsaw mechanic out of the run and the ability
  # item with it.
  archive_packs:
    - good_tidings
    - trick_or_tidy
    - merry_mess
    - drawer_chores
    - something_eggstra
    - snack_pack

  # ---- DLC -------------------------------------------------------------

  # The two DLCs, both OFF by default. Turn one on only if you own it: a seed
  # that contains its puzzles cannot be played without it, and the mod refuses
  # to connect rather than hand you a level that will not load.
  #
  # Whoever generates the multiworld does not need to own either one.
  #
  #   cupboards_and_drawers   25 puzzles,  32 solutions
  #   seeing_stars            37 puzzles, 100 solutions
  #
  # Seeing Stars carries more alternate solutions than the whole base campaign,
  # so it is the one that changes a star_levels goal most. Five of its puzzles
  # are locked by the game behind a star total; the mod opens those for you.
  cupboards_and_drawers: false
  seeing_stars: false

  # Their share of the run, on the same relative scale as the three weights
  # above. Ignored while the matching toggle is off.
  cupboards_weight: 10
  stars_weight: 10

  # ---- Abilities -------------------------------------------------------

  # Lock puzzle mechanics behind items. On, objects for a mechanic you have
  # not unlocked sit dimmed and untouchable, so a puzzle can be partly
  # solved and returned to. Off, the packs are the only gate.
  ability_locks: true

  # How many mechanics you begin with. 0 to 6.
  starting_abilities: 1

  # How many opening puzzles must be solvable straight away. Four always
  # are, so this only has an effect above four. 0 to 10.
  guaranteed_open_slots: 4

  # ---- Items -----------------------------------------------------------

  # How many Skip items are shuffled in. A Skip clears a puzzle you are
  # stuck on. A skip finishes it, and DOES count towards the credits. 0 to 20.
  skip_count: 5

  # Percentage of this seed's hint pages that get a Hint Page item. A
  # 79-puzzle seed holds about 110 pages, so 50 is roughly 55 items. At 100
  # the hints crowd out almost everything else. Without a Hint Page the
  # notepad still opens - you just cannot erase the scribble. 0 to 100.
  hint_coverage: 50

  # Percentage of FILLER items that are the cat knocking your work over.
  # Costs you time, never progress. 0 to 100.
  cat_trap_chance: 25

  # ---- Standard Archipelago options ------------------------------------

  progression_balancing: 50
  accessibility: full
