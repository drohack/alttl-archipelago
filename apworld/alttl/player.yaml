# A Little to the Left - Archipelago player settings
#
# Edit `name`, save, and hand this file to whoever generates the multiworld.
# Every setting is at its default, so it works untouched. This is the short
# version: the options page on the Archipelago website explains each one in
# full. Each setting ends with the values it accepts.

# Your name in the multiworld, at most 16 characters. {player} becomes your
# slot number and {number} a counter: keep one if you generate several slots
# from this file, since two slots with the same name will not generate.
name: Player{number}

game: A Little to the Left

# Describes this file, not the game - handy once you have several.
description: Default A Little to the Left Template

requires:
  version: 0.6.7

A Little to the Left:

  # ---- The run ----------------------------------------------------------

  # How many puzzles the run holds; the game's own campaign is 79. At 70 the
  # level select's overview strip fits as it is; longer runs shrink it.
  # 10 to 130.
  puzzle_count: 70

  # Puzzles each pack opens, the free opening included. A floor: a run holds
  # at most 14 packs, so a long run makes them bigger (79 puzzles get packs
  # of 6). 5 to 20.
  pack_size: 5

  # What unlocks the credits:
  #
  #   beat_levels    beat levels_to_beat puzzles
  #   collect_stars  collect stars_to_collect stars, one per solution found
  #
  # A skipped puzzle counts as beaten, and its stars count too.
  goal: beat_levels

  # For beat_levels. More than the run holds means all of them. 1 to 130.
  levels_to_beat: 50

  # For collect_stars. A default run holds about 91 stars (84 to 100); 65 is
  # what 50 of its puzzles are worth. More than the run holds means all of
  # them. 1 to 300.
  stars_to_collect: 65

  # ---- DLC --------------------------------------------------------------

  # Turn one on only if you own it: the mod will not connect to a seed that
  # needs a DLC you do not have. Whoever generates needs neither.
  #
  #   cupboards_and_drawers   25 puzzles,  32 solutions
  #   seeing_stars            37 puzzles, 100 solutions
  cupboards_and_drawers: false
  seeing_stars: false

  # ---- Where the puzzles come from --------------------------------------

  # One weight per source. They are relative (80/10/10 is 8/1/1), 0 means
  # never, and a DLC's weight counts only while that DLC is on. Puzzles the
  # mechanic reserve (below) does not place each roll a source; with the
  # defaults:
  #
  #   no DLC      generator 80%, event 10%, campaign 10%
  #   one DLC     generator 73%, event 9%, campaign 9%, the DLC 9%
  #   both DLCs   generator 67%, event 8%, campaign 8%, each DLC 8%
  #
  #   generator_weight   the 16 generated puzzles, a new layout every time
  #   archive_weight     the 26 seasonal event puzzles
  #   base_weight        the 69 campaign puzzles
  #   cupboards_weight   Cupboards and Drawers
  #   stars_weight       Seeing Stars
  #
  # Only a generated puzzle can appear more than once (see
  # generator_repeat_limit); every other puzzle appears at most once. A
  # source that runs out falls back to the generators. 0 to 100 each.
  generator_weight: 80
  archive_weight: 10
  base_weight: 10
  cupboards_weight: 10
  stars_weight: 10

  # Which seasonal event packs may appear; delete a line to drop one.
  # Without a DLC, the first four hold the only jigsaws.
  #
  #   good_tidings       Good Tidings       6 puzzles
  #   trick_or_tidy      Trick or Tidy      5 puzzles
  #   merry_mess         Merry Mess         5 puzzles
  #   drawer_chores      Drawer Chores      3 puzzles
  #   something_eggstra  Something Eggstra  4 puzzles
  #   snack_pack         Snack Pack         3 puzzles
  archive_packs:
    - good_tidings
    - trick_or_tidy
    - merry_mess
    - drawer_chores
    - something_eggstra
    - snack_pack

  # No generator makes stacking, container, drawer or jigsaw puzzles (nor,
  # with Seeing Stars, distributing), so without this they come up only by
  # luck. Before the weights roll, the run takes this many puzzles with each
  # of those mechanics, and one puzzle for each of the others - about 10
  # puzzles at 3, never more than half the run. Higher means more of every
  # run is the same hand-made puzzles:
  #
  #   0   off - the weights decide everything; a short run can miss a mechanic
  #   3   the default
  #   4   every run holds all 4 jigsaw puzzles (without a DLC)
  #   5   and all 5 drawer puzzles (without a DLC)
  #
  # 0 to 10.
  mechanic_coverage: 3

  # How many times one generated puzzle may appear in a run, each copy a new
  # layout ("Pencils (Randomized)", "Pencils (Randomized) #2", ...). Only
  # generated puzzles repeat. 1 to 8; 0, from older files, means 8.
  generator_repeat_limit: 8

  # ---- Abilities --------------------------------------------------------

  # Lock each mechanic behind an item: until it arrives, its objects are
  # dimmed and cannot be moved. Off, only the packs gate the run.
  ability_locks: true

  # Mechanics you start with; the run adds more if its opening needs them.
  # 0 to 13.
  starting_abilities: 1

  # Opening puzzles that must be solvable with what you start with. Ignored
  # when ability_locks is off. 4 to 20.
  guaranteed_open_slots: 5

  # ---- Items and checks -------------------------------------------------

  # Skips in the item pool. A Skip finishes a puzzle outright: every check
  # on it is sent as found, every solution included, so it counts as
  # beaten and all its stars light. 0 to 50.
  skip_count: 5

  # Percent of the run's hint pages sure to get a Hint Page item; more come
  # as filler. Without one the notepad opens but stays scribbled. 0 to 100.
  hint_coverage: 50

  # Percent of filler that is a Cat Trap: the cat knocks your work over.
  # Costs time, never progress. 0 to 100.
  cat_trap_chance: 15

  # Percent of filler that is a Background Change Trap: every backdrop
  # recoloured. The filler left over is Hint Pages and Background Reset
  # Tokens; a token puts the colours back, from the pause menu. 0 to 100.
  background_trap_chance: 15

  # The game's puzzle achievements as checks: 7 in the base game, 17 with
  # both DLCs, each only when its puzzle is in the run. Steam achievements
  # stay off either way.
  achievements: false

  # ---- Standard Archipelago options -------------------------------------

  progression_balancing: 50
  accessibility: full
